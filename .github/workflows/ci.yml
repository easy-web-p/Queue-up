name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Java is needed by the Firestore emulator that the rules suite runs against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      # The runner is UTC. Slot ids must not depend on the host time zone, so
      # running the suite here is itself the regression test for that.
      - name: Unit and authorization tests
        run: npm test
        env:
          TZ: UTC

      - name: Firestore rules tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-queueup-rules "node server/tests/firestoreRules.test.js"

      # The serverless entry point must stay importable: a broken api/index.js
      # only surfaces as a 500 on every API route after deploy.
      - name: Verify the serverless entry point loads
        run: node --check api/index.js && node --check server/app.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
